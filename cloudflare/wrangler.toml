name = "gestao-logistica-api"
main = "./worker.mjs"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
DIGITAL_SYNC_ENABLED = "true"
DIGITAL_SYNC_WRITE_ENABLED = "false"
DIGITAL_SYNC_MAX_IMPORTS_PER_CYCLE = "1"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "API_DATABASE"
class_name = "ApiDatabase"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApiDatabase"]
