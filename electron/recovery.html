<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperação do Gestão Logística</title>
    <style>
      :root { color-scheme: light; font: 15px "Segoe UI", sans-serif; color: #14243b; background: #f1f5f9; }
      body { margin: 0; padding: 28px; }
      main { max-width: 470px; margin: 20px auto; padding: 28px; border: 1px solid #d8e1ee; border-radius: 16px; background: white; box-shadow: 0 14px 38px #14243b18; }
      h1 { margin: 0 0 12px; font-size: 22px; }
      p { line-height: 1.5; color: #52647c; }
      #status { min-height: 24px; color: #174ea6; font-weight: 600; }
      .actions { display: grid; gap: 9px; margin-top: 22px; }
      button { border: 1px solid #cbd7e7; border-radius: 8px; background: white; color: #174ea6; padding: 11px 14px; font: inherit; font-weight: 600; cursor: pointer; }
      button.primary { color: white; border-color: #1769c2; background: #1769c2; }
      button:disabled { opacity: .48; cursor: default; }
      #detail { min-height: 18px; font-size: 12px; }
    </style>
    <script src="./recovery-renderer.js" defer></script>
  </head>
  <body>
    <main>
      <h1>O Gestão Logística precisa de uma correção.</h1>
      <p>O aplicativo encontrou um erro ao iniciar. O serviço de atualização permanece disponível para recuperar esta instalação.</p>
      <p id="status" role="status" aria-live="polite">Preparando atualização…</p>
      <div class="actions">
        <button id="check">Verificar atualização</button>
        <button id="download" class="primary" disabled>Baixar correção</button>
        <button id="install" disabled>Instalar correção e reiniciar</button>
      </div>
      <p id="detail">O aplicativo não ocultará erros de inicialização.</p>
    </main>
  </body>
</html>
